<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<meta name="referrer" content="no-referrer">
<meta name="color-scheme" content="dark light">
<title>Opening Gym Log</title>
<link rel="stylesheet" href="tokens.css">
<style>
*{box-sizing:border-box}
body{margin:0;min-height:100vh;min-height:100dvh;display:grid;place-items:center;padding:16px;background:var(--bg);color:var(--ink);font:600 16px/1.5 Nunito,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
main{width:100%;max-width:420px;background:var(--surface);border-radius:var(--radius-xl);padding:24px}
h1{margin:0 0 8px;font-size:22px;font-weight:900;line-height:1.25;text-wrap:balance}
p{margin:0 0 20px;color:var(--ink-muted)}
p.warn{color:var(--danger)}
a{display:flex;align-items:center;justify-content:center;min-height:var(--button-lg);padding:12px 16px;border-radius:var(--radius-pill);background:var(--brand);color:var(--on-brand);font-weight:800;font-size:17px;text-decoration:none;touch-action:manipulation}
a:focus-visible{outline:2px solid var(--brand-text);outline-offset:2px}
</style>
</head>
<body>
<main>
<h1 id="title">Opening Gym Log…</h1>
<p id="text">Finishing sign-in in the Gym Log app on this phone. If it doesn’t open by itself, tap the button.</p>
<a id="open" href="intent://login#Intent;scheme=io.github.raja2102598.gymlog;package=io.github.raja2102598.gymlog;end">Open Gym Log</a>
</main>
<script>
// Sign-in links asked for in the Gym Log Android app land here (APP_LOGIN_PAGE in src/lib/native.ts) and go
// on to the app with their code, which only that app can use. The button always works; opening by itself
// works when the browser allows it.
(function () {
  var q = new URLSearchParams(location.search), h = new URLSearchParams(location.hash.slice(1));
  var why = q.get("error_description") || h.get("error_description");
  var open = document.getElementById("open");
  if (why || !q.get("code")) {
    var text = document.getElementById("text");
    document.getElementById("title").textContent = "This sign-in link didn’t work";
    text.textContent = (why ? why.replace(/\.?$/, ". ") : "") + "Go back to Gym Log, send a new link, and open the newest email on this phone.";
    text.className = "warn";
    return;
  }
  open.href = "intent://login" + location.search + "#Intent;scheme=io.github.raja2102598.gymlog;package=io.github.raja2102598.gymlog;end";
  // Once the page is up, so it stays readable if the browser won't open the app without a tap.
  addEventListener("load", function () {
    location.replace(open.href);
  });
})();
</script>
</body>
</html>
