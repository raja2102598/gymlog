<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<meta name="referrer" content="no-referrer">
<meta name="color-scheme" content="light dark">
<title>Opening Gym Log</title>
<style>
:root{--ground:#eef0f2;--surface:#fff;--ink:#15171b;--muted:#5b6270;--good:#287346;--on-good:#fff;--warn:#b34a17}
@media (prefers-color-scheme:dark){:root{--ground:#121417;--surface:#1b1e23;--ink:#eceef1;--muted:#9aa2ae;--good:#5cc488;--on-good:#121417;--warn:#e9773f}}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;min-height:100dvh;display:grid;place-items:center;padding:16px;background:var(--ground);color:var(--ink);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
main{width:100%;max-width:420px;background:var(--surface);border-radius:16px;padding:24px;box-shadow:0 1px 2px rgb(0 0 0/.08),0 4px 16px rgb(0 0 0/.06)}
h1{margin:0 0 8px;font-size:22px;line-height:1.25;text-wrap:balance}
p{margin:0 0 20px;color:var(--muted)}
p.warn{color:var(--warn)}
a{display:flex;align-items:center;justify-content:center;min-height:48px;padding:12px 16px;border-radius:10px;background:var(--good);color:var(--on-good);font-weight:600;text-decoration:none;touch-action:manipulation}
a:focus-visible{outline:3px solid var(--ink);outline-offset:2px}
</style>
</head>
<body>
<main>
<h1 id="title">Opening Gym Log…</h1>
<p id="text">Finishing sign-in in the Gym Log app on this phone. If it doesn’t open by itself, tap the button.</p>
<a id="open" href="intent://login#Intent;scheme=io.github.raja2102598.gymlog;package=io.github.raja2102598.gymlog;end">Open Gym Log</a>
</main>
<script>
// Sign-in links asked for in the Gym Log Android app land here (APP_LOGIN_PAGE in src/lib/native.ts) and go
// on to the app with their code, which only that app can use. The button always works; opening by itself
// works when the browser allows it.
(function () {
  var q = new URLSearchParams(location.search), h = new URLSearchParams(location.hash.slice(1));
  var why = q.get("error_description") || h.get("error_description");
  var open = document.getElementById("open");
  if (why || !q.get("code")) {
    var text = document.getElementById("text");
    document.getElementById("title").textContent = "This sign-in link didn’t work";
    text.textContent = (why ? why.replace(/\.?$/, ". ") : "") + "Go back to Gym Log, send a new link, and open the newest email on this phone.";
    text.className = "warn";
    return;
  }
  open.href = "intent://login" + location.search + "#Intent;scheme=io.github.raja2102598.gymlog;package=io.github.raja2102598.gymlog;end";
  // Once the page is up, so it stays readable if the browser won't open the app without a tap.
  addEventListener("load", function () {
    location.replace(open.href);
  });
})();
</script>
</body>
</html>
