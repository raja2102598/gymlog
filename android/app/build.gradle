apply plugin: 'com.android.application'
apply plugin: 'org.jetbrains.kotlin.android'

android {
    namespace = "io.github.raja2102598.gymlog"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "io.github.raja2102598.gymlog"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        // CI numbers each build, so a newer APK installs over an older one.
        versionCode = (System.getenv("GYMLOG_VERSION_CODE") ?: "1").toInteger()
        versionName = "1.0." + (System.getenv("GYMLOG_VERSION_CODE") ?: "0")
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    // Release builds are signed with the key named by GYMLOG_KEYSTORE (a file) and GYMLOG_KEYSTORE_PASSWORD,
    // which CI takes from the repository's secrets; without them they're signed with the debug key.
    // The keystore itself is never committed (see .gitignore).
    signingConfigs {
        release {
            if (System.getenv("GYMLOG_KEYSTORE")) {
                storeFile file(System.getenv("GYMLOG_KEYSTORE"))
                storePassword System.getenv("GYMLOG_KEYSTORE_PASSWORD")
                keyAlias "gymlog"
                keyPassword System.getenv("GYMLOG_KEYSTORE_PASSWORD")
            }
        }
    }
    kotlinOptions {
        jvmTarget = JavaVersion.VERSION_21.toString()
    }
    testOptions {
        // HealthDaysTest reads the fixture shared with the web app's tests, so the tests run again when it changes
        // (the build cache would otherwise reuse the last result, as if only the Kotlin mattered).
        unitTests.all {
            def fixtures = rootProject.file("../tests/fixtures")
            it.systemProperty "fixtures", fixtures.absolutePath
            it.inputs.dir(fixtures).withPropertyName("fixtures").withPathSensitivity(PathSensitivity.RELATIVE)
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
            signingConfig System.getenv("GYMLOG_KEYSTORE") ? signingConfigs.release : signingConfigs.debug
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    // Background sync: WorkManager runs HealthSyncWorker; it reads through the Health plugin's HealthManager.
    implementation "androidx.work:work-runtime-ktx:2.12.0"
    implementation "androidx.health.connect:connect-client:1.1.0"
    implementation "org.jetbrains.kotlinx:kotlinx-coroutines-android:1.11.0"
    // Continue with Google: Android's account sheet (Credential Manager), see GoogleSignInPlugin.
    implementation "androidx.credentials:credentials:1.6.0"
    implementation "androidx.credentials:credentials-play-services-auth:1.6.0"
    implementation "com.google.android.libraries.identity.googleid:googleid:1.2.1"
    testImplementation "junit:junit:$junitVersion"
    // The real org.json for unit tests (Android's is only stubs off a device).
    testImplementation "org.json:json:20260814"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
