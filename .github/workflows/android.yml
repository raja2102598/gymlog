# The Android app (android/, built with Capacitor around the same static site): builds the APK for every
# pull request and push to main, and on main publishes it as the "android-latest" release. A pushed tag such as
# v1.2.0 also builds, and publishes a permanent release for that tag.
#
# Signing: with the GYMLOG_KEYSTORE_BASE64 and GYMLOG_KEYSTORE_PASSWORD repository secrets, the APK is signed
# with the app's own key, so each one installs over the last. Without them it's signed with a throwaway debug
# key: fine for trying a build, but it won't install over the app on your phone, so nothing is published.
name: Android app

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      signed: ${{ steps.apk.outputs.signed }}
      version: ${{ steps.apk.outputs.version }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      # Gradle's downloads and its build cache (android/gradle.properties turns it on). A run saves them when the
      # Android side has changed (android/, or the Capacitor plugins in package-lock.json), and every run starts from
      # the newest it can see, its own branch's or else main's. So a change to the site alone compiles nothing again,
      # and one to the app itself still starts from everything else.
      - uses: actions/cache@v6
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('android/**', 'package-lock.json') }}
          restore-keys: gradle-${{ runner.os }}-
      - run: npm ci
      # Next.js's build cache (its compiler's and TypeScript's work, in .next/cache), which Next.js asks CI to keep:
      # a run starts from the newest one for the same packages and only redoes what changed.
      - uses: actions/cache@v6
        with:
          path: .next/cache
          key: nextjs-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-${{ hashFiles('src/**', 'next.config.ts', 'tsconfig.json') }}
          restore-keys: nextjs-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-
      # Where the APK points (see .env.example): the repository's variables, never the source. A pull request may lack
      # them (a fork's does), which only makes an APK that shows the setup screen; a build for publishing must have them.
      - name: Build the site and copy it into the app
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ vars.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ vars.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
          NEXT_PUBLIC_SITE_URL: ${{ vars.NEXT_PUBLIC_SITE_URL }}
          NEXT_PUBLIC_GOOGLE_WEB_CLIENT_ID: ${{ vars.NEXT_PUBLIC_GOOGLE_WEB_CLIENT_ID }}
          NEXT_PUBLIC_YOUTUBE_API_KEY: ${{ vars.NEXT_PUBLIC_YOUTUBE_API_KEY }}
        run: |
          if [ -z "$NEXT_PUBLIC_SUPABASE_URL" ] || [ -z "$NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY" ]; then
            if [ "$GITHUB_EVENT_NAME" = pull_request ]; then
              echo "::warning::No NEXT_PUBLIC_SUPABASE_URL and NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY repository variables, so this APK has no Supabase project and shows the setup screen. Fine for checking the build; see .env.example."
            else
              echo "::error::Add the NEXT_PUBLIC_SUPABASE_URL and NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY repository variables (Settings → Secrets and variables → Actions → Variables) before publishing; see .env.example."
              exit 1
            fi
          fi
          npm run android
      # The Kotlin tests include the background sync's check against tests/fixtures/health-days.json, which the
      # website's unit tests check too, so both turn Health Connect's readings into the same days. They run against
      # the release build, which the APK needs anyway, so nothing is compiled twice.
      - name: Test the Kotlin and build the APK
        id: apk
        working-directory: android
        env:
          GYMLOG_VERSION_CODE: ${{ github.run_number }}
          KEYSTORE_BASE64: ${{ secrets.GYMLOG_KEYSTORE_BASE64 }}
          GYMLOG_KEYSTORE_PASSWORD: ${{ secrets.GYMLOG_KEYSTORE_PASSWORD }}
          # So the app can check its own repo's releases for a newer build (AppUpdatePlugin); a fork's build then
          # follows the fork's releases, never this one.
          GYMLOG_UPDATE_REPO: ${{ github.repository }}
        run: |
          # A tag such as v1.2.0 names the build 1.2.0; anything else is 1.0.<run number>.
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then export GYMLOG_VERSION_NAME="${GITHUB_REF_NAME#v}"; fi
          if [ -n "$KEYSTORE_BASE64" ]; then
            trap 'rm -f "$RUNNER_TEMP/gymlog.p12"' EXIT
            printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/gymlog.p12"
            export GYMLOG_KEYSTORE="$RUNNER_TEMP/gymlog.p12"
            echo "signed=true" >> "$GITHUB_OUTPUT"
            # The signing certificate's fingerprints (public: anyone can read them from the APK). Google Cloud needs
            # the SHA-1 for Continue with Google in the app; see README.md.
            {
              echo "### Signing certificate"
              echo '```'
              keytool -list -v -storetype PKCS12 -keystore "$GYMLOG_KEYSTORE" -storepass:env GYMLOG_KEYSTORE_PASSWORD | grep -E "^\s*SHA(1|256):" | sed 's/^\s*//' || echo "(couldn't read them)"
              echo '```'
            } | tee -a "$GITHUB_STEP_SUMMARY"
          else
            echo "::warning::No GYMLOG_KEYSTORE_BASE64 secret, so this APK is signed with a throwaway debug key and won't install over the app on your phone. See README.md, Android app."
            echo "signed=false" >> "$GITHUB_OUTPUT"
          fi
          ./gradlew testReleaseUnitTest assembleRelease --no-daemon --console=plain
          mv app/build/outputs/apk/release/app-release.apk "$RUNNER_TEMP/gym-log.apk"
          echo "version=${GYMLOG_VERSION_NAME:-1.0.$GYMLOG_VERSION_CODE}" >> "$GITHUB_OUTPUT"
          # version.json, next to the APK: what AppUpdatePlugin reads to tell a newer build from an older one and
          # verify a download, published alongside gym-log.apk by both release jobs below.
          jq -n \
            --argjson code "$GYMLOG_VERSION_CODE" \
            --arg name "${GYMLOG_VERSION_NAME:-1.0.$GYMLOG_VERSION_CODE}" \
            --arg commit "$GITHUB_SHA" \
            --argjson size "$(stat -c%s "$RUNNER_TEMP/gym-log.apk")" \
            --arg sha256 "$(sha256sum "$RUNNER_TEMP/gym-log.apk" | cut -d' ' -f1)" \
            '{versionCode: $code, versionName: $name, commit: $commit, size: $size, sha256: $sha256}' \
            > "$RUNNER_TEMP/version.json"
      - uses: actions/upload-artifact@v7
        with:
          name: gym-log-apk
          path: |
            ${{ runner.temp }}/gym-log.apk
            ${{ runner.temp }}/version.json
          if-no-files-found: error
          retention-days: 30

  release:
    needs: build
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && needs.build.outputs.signed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: gym-log-apk
      # Updated in place: new files, then the tag moved on. Deleting the release and its tag and making both again
      # raced GitHub, which drafts the release a deleted tag belonged to and sometimes got there after the new one was
      # out: 1.0.70 ended up a draft nobody else can see, so the app found nothing to update to.
      - name: Update the android-latest release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          title="Gym Log for Android $VERSION"
          notes="Open this page on your phone, download gym-log.apk and open it to install or update, or use Settings → About → Check for updates in the app. Built from $GITHUB_SHA."
          # A draft under the tag (as that race left) is invisible to the app, and gh would take it for the release.
          for id in $(gh api "repos/$GH_REPO/releases?per_page=100" --jq '.[] | select(.draft and .tag_name == "android-latest") | .id'); do
            gh api --method DELETE "repos/$GH_REPO/releases/$id"
          done
          if gh release view android-latest > /dev/null 2>&1; then
            # The APK first, then version.json, so version.json never names an APK that isn't there yet.
            gh release upload android-latest gym-log.apk --clobber
            gh release upload android-latest version.json --clobber
            gh release edit android-latest --title "$title" --notes "$notes" --latest
          else
            gh release create android-latest gym-log.apk version.json --target "$GITHUB_SHA" --latest --title "$title" --notes "$notes"
          fi
          # The tag follows, for the release page's commit and source files; the app only reads the files above.
          gh api --method PATCH "repos/$GH_REPO/git/refs/tags/android-latest" -f sha="$GITHUB_SHA" -F force=true --silent ||
            echo "::warning::Couldn't move the android-latest tag to $GITHUB_SHA. The release has this build's files; only its tag is behind."
      # What the app reads (AppUpdatePlugin): the job fails unless the public version.json is this build's, so a
      # release the app can't see never passes as published again.
      - name: Check the app will find this build
        env:
          GH_REPO: ${{ github.repository }}
        run: |
          want=$(jq -r .versionCode version.json)
          for try in $(seq 1 12); do
            got=$(curl -fsSL "https://github.com/$GH_REPO/releases/download/android-latest/version.json" | jq -r .versionCode) || got=""
            if [ "$got" = "$want" ]; then echo "The app will find build $want."; exit 0; fi
            sleep 5
          done
          echo "::error::The published version.json names build ${got:-nothing}, not $want, so the app won't offer this one. Check the android-latest release."
          exit 1

  # A tag's release stays, unlike android-latest, so a build people installed can always be found again. It isn't
  # marked Latest: android-latest stays the newest build.
  release-tag:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v') && needs.build.outputs.signed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: gym-log-apk
      - name: Publish a release for the tag
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ needs.build.outputs.version }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" gym-log.apk version.json --clobber
          else
            gh release create "$GITHUB_REF_NAME" gym-log.apk version.json --verify-tag --latest=false \
              --title "Gym Log for Android $VERSION" \
              --notes "Open this page on your phone, download gym-log.apk and open it to install or update. Built from $GITHUB_SHA. The build's summary lists the signing certificate's fingerprints: $RUN_URL"
          fi
